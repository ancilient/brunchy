# Builds the student app (Flutter) APK on GitHub's servers.
# Runs on every push to main that changes frontend/student_app/, or by hand: Actions → Build Student App APK → Run workflow.
# Download "Brunchy-student-apk" from the finished run's Artifacts section.
name: Build Student App APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['frontend/student_app/**', '.github/workflows/flutter-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend/student_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: bash build-apk.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Brunchy-student-apk
          path: frontend/student_app/Brunchy-flutter.apk
