name: brunchy_vendor
description: Brunchy Vendor App — manage stall orders, inventory, menu and analytics.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  equatable: ^3.0.0
  go_router: ^18.1.4
  get_it: ^9.3.0
  dio: ^5.7.0
  shared_preferences: ^2.3.4
  hive_flutter: ^1.1.0
  web_socket_channel: ^3.0.1
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  fl_chart: ^1.3.1
  shimmer: ^4.0.0
  intl: ^0.20.3
  confetti: ^0.8.0
  permission_handler: ^13.0.2
  google_fonts: ^9.0.0
  socket_io_client: ^3.1.6
  image_picker: ^1.1.2      # menu item photos (camera / gallery), see core/utils/image_helper.dart
  image: ^4.3.0
  path_provider: ^2.1.5
  lottie: ^3.8.2
  google_sign_in: ^7.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  # The real vendor badge (app icon/original/brunchy-vendor-logo.png; images made by student_app/tool/splash/vendor_assets.py).
  # The round disc fills the icon mask; the background is the disc's rim colour, for square-ish launcher shapes.
  android: true
  ios: true
  image_path: assets/app-icon.png
  remove_alpha_ios: true
  background_color_ios: "#01D6D0"
  adaptive_icon_background: "#01D6D0"
  adaptive_icon_foreground: assets/app-icon.png
  adaptive_icon_foreground_inset: 15

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/brand/burger.png
    - assets/splash/brunchy_vendor_splash.json
    - assets/audio/new_order.mp3
    - assets/audio/success.mp3
    - assets/audio/urgent.mp3
