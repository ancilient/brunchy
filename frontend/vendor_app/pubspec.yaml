name: brunchy_vendor
description: Brunchy Vendor App — manage stall orders, inventory, menu and analytics.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  go_router: ^14.6.2
  get_it: ^8.0.3
  dio: ^5.7.0
  shared_preferences: ^2.3.4
  hive_flutter: ^1.1.0
  web_socket_channel: ^3.0.1
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  confetti: ^0.7.0
  permission_handler: ^11.3.1
  google_fonts: ^6.2.1
  socket_io_client: ^3.1.6
  lottie: ^3.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  # The Brunchy burger logo on the vendor teal (rendered by student_app/tool/splash, same vector as the splash).
  android: true
  ios: true
  image_path: assets/app-icon.png
  remove_alpha_ios: true
  adaptive_icon_background: "#14C4AE"
  adaptive_icon_foreground: assets/app-icon.png
  adaptive_icon_foreground_inset: 21

flutter:
  uses-material-design: true
  assets:
    - assets/brand/logo.png
    - assets/brand/burger.png
    - assets/splash/brunchy_vendor_splash.json
    - assets/audio/new_order.mp3
    - assets/audio/success.mp3
    - assets/audio/urgent.mp3
