name: brunchy_vendor
description: Brunchy Vendor App — manage stall orders, inventory, menu and analytics.
publish_to: 'none'
version: 1.0.1+2

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.0.0
  equatable: ^2.0.5
  go_router: ^14.6.2
  get_it: ^8.0.3
  dio: ^5.7.0
  shared_preferences: ^2.3.4
  hive_flutter: ^1.1.0
  web_socket_channel: ^3.0.1
  audioplayers: ^6.1.0
  flutter_tts: ^4.2.0
  fl_chart: ^0.69.0
  shimmer: ^3.0.0
  intl: ^0.19.0
  confetti: ^0.7.0
  permission_handler: ^11.3.1
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/brunchy_vendor_badge.png
  adaptive_icon_background: "#00D6CC"
  adaptive_icon_foreground: assets/branding/brunchy_vendor_badge_transparent.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/logo_mascot.png
    - assets/images/logo_horizontal.png
    - assets/images/logo_vendor_badge.jpg
    - assets/branding/brunchy_vendor_badge.png
    - assets/branding/brunchy_vendor_badge_transparent.png
    - assets/audio/new_order.mp3
    - assets/audio/success.mp3
    - assets/audio/urgent.mp3
