name: brunchy
description: Brunchy campus canteen ordering app (Flutter version of the React app).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  # Ranges, not exact versions, so `flutter pub get` picks the newest one that works with your Flutter.
  shared_preferences: '>=2.2.0 <3.0.0'   # keeps orders, cart and login on the phone
  google_fonts: '>=6.2.1 <9.0.0'         # Inter, Poppins, JetBrains Mono (same fonts as the React app)
  flutter_svg: '>=2.0.10 <3.0.0'         # draws the Lucide icons
  http: ^1.6.0
  socket_io_client: ^3.1.6
  google_sign_in: ^7.2.0
  lottie: ^3.8.2                         # splash animation (vector, assets/splash)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: '>=0.13.1 <1.0.0'
  flutter_lints: '>=4.0.0 <7.0.0'

flutter:
  uses-material-design: true
  assets:
    - assets/splash/brunchy_splash.json
    - assets/payment/
    - assets/brand/logo.png

# Yellow burger app icon (the real full-bleed square logo, app icon/original). Run: dart run flutter_launcher_icons
# The adaptive background is the icon's own yellow, so the inset foreground blends into it seamlessly.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/app-icon.png
  adaptive_icon_background: '#FDDC1F'
  adaptive_icon_foreground: assets/app-icon.png
  adaptive_icon_foreground_inset: 21 # keeps "Brunchy" clear of the edge on round launchers
  min_sdk_android: 21
